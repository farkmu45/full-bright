services:
  app:
    build:
      context: .
      target: app
    restart: unless-stopped
    env_file: .env.docker
    environment:
      DB_HOST: db
      INERTIA_SSR_ENABLED: "true"
      INERTIA_SSR_URL: http://ssr:13714
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      ssr:
        condition: service_started

  ssr:
    build:
      context: .
      target: ssr
    restart: unless-stopped
    expose:
      - "13714"

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      - app

  db:
    image: mysql:8.4
    restart: unless-stopped
    # sized for a small shared VPS: performance_schema alone costs ~200 MB
    command:
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=128M
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-pbm_landing_page}
      MYSQL_USER: ${DB_USERNAME:-pbm}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env.docker}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env.docker}
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db:
  storage:
